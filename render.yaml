services:
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:combined
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-api.onrender.com/auth/google/callback
      - key: FRONTEND_URL
        sync: false
      - key: QUEUE_NAME
        value: email-send
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 200
      - key: STALE_PROCESSING_MS
        value: 300000
      - key: JOB_ATTEMPTS
        value: 3
      - key: ETHEREAL_AUTO_CREATE_SENDERS
        value: 2
      - key: LOG_LEVEL
        value: info

  - type: redis
    name: reachinbox-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: reachinbox-db
    plan: free
    region: oregon
    databaseName: reachinbox
    user: reachinbox
